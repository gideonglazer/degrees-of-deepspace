# Macro definitions for the Twee 3 Language Tools VS Code extension.
#
# The extension only knows SugarCube's built-in macros. Anything you define with DefineMacro or
# DefineMacroS needs an entry here, otherwise it gets flagged as an unrecognised macro in every
# passage that uses it.
#
# Format, with the parameters block optional:
#
#   sugarcube-2:
#     macro:
#       myMacro:
#         name: myMacro
#         description: What it does.
#         container: false        # true for macros with a matching <</myMacro>>
#         parameters:
#           - text &+ number      # one entry per accepted signature
#
# See https://github.com/cyrusfirheir/twee3-language-tools for the full schema.

sugarcube-2:
    macro:
        ccRadios:
            name: ccRadios
            description: Renders labelled radiobuttons from a Constants.character catalogue.
            parameters:
                - text &+ text
		ccCheck:
            name: ccCheck
            description: Renders a checkbox bound to a boolean story variable.
            parameters:
                - text
                - text |+ text
        ccPanelSwitch:
            name: ccPanelSwitch
            description: Switches the Start-page creator tab and re-renders the panel.
            parameters:
                - text
        ccLiListbox:
            name: ccLiListbox
            description: Renders the love-interest dropdown bound to $liFocus.
            parameters: []
        ccLiNameRadios:
            name: ccLiNameRadios
            description: Renders Display Name locale radios for the focused love interest.
            parameters: []
