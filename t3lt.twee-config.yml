# Macro definitions for the Twee 3 Language Tools VS Code extension.
#
# The extension only knows SugarCube's built-in macros. Anything you define with DefineMacro or
# DefineMacroS needs an entry here, otherwise it gets flagged as an unrecognised macro in every
# passage that uses it.
#
# Format, with the parameters block optional:
#
#   sugarcube-2:
#     macro:
#       myMacro:
#         name: myMacro
#         description: What it does.
#         container: false        # true for macros with a matching <</myMacro>>
#         parameters:
#           - text &+ number      # one entry per accepted signature
#
# See https://github.com/cyrusfirheir/twee3-language-tools for the full schema.

sugarcube-2:
    macro:
        ccRadios:
            name: ccRadios
            description: Renders labelled radiobuttons from a Constants.character catalogue.
            parameters:
                - text &+ text
        ccCheck:
            name: ccCheck
            description: Renders a checkbox bound to a boolean story variable.
            parameters:
                - text
                - text |+ text
        ccPanelSwitch:
            name: ccPanelSwitch
            description: Switches the Start-page creator tab and re-renders the panel.
            parameters:
                - text
        ccLiListbox:
            name: ccLiListbox
            description: Renders the love-interest dropdown bound to $liFocus.
            parameters: []
        ccLiNameRadios:
            name: ccLiNameRadios
            description: Renders Display Name locale radios for the focused love interest.
            parameters: []
        money:
            name: money
            description: Formats an amount with the selected currency symbol.
            parameters:
                - "|+ number"
                - "|+ text"
        worldDate:
            name: worldDate
            description: Prints the current in-game date using $options.dateFormat.
            parameters: []
        worldDateLong:
            name: worldDateLong
            description: Prints a long-form in-game date.
            parameters: []
        worldTime:
            name: worldTime
            description: Prints the current in-game time using $options.timeFormat.
            parameters: []
        worldWeather:
            name: worldWeather
            description: Prints the current weather as prose text.
            parameters: []
        worldTemp:
            name: worldTemp
            description: Prints ambient temperature using $options.temperature.
            parameters: []
        honorific:
            name: honorific
            description: Prints Mr./Ms./Mx. for the player gender.
            parameters: []
        honourific:
            name: honourific
            description: Alias of honorific.
            parameters: []
        pronouns:
            name: pronouns
            description: Sets who <<he>>/<<him>>/<<his>>/<<gendered>> refer to (player or LI id).
            parameters:
                - "|+ text"
        gendered:
            name: gendered
            description: Picks masc/femme/neutral wording for the active pronoun focus.
            parameters:
                - text &+ text &+ text
        liname:
            name: liname
            description: Prints a love interest display name by id.
            parameters:
                - text
        affinity:
            name: affinity
            description: Applies a love-interest affinity tier (+/++/+++ or -/--/---) and prints the indicator.
            parameters:
                - text &+ text
        stress:
            name: stress
            description: Applies a stress effect tier (+/++/+++ or -/--/---) and prints the indicator.
            parameters:
                - text
        arousal:
            name: arousal
            description: Applies an arousal effect tier and prints the indicator.
            parameters:
                - text
        pain:
            name: pain
            description: Applies a pain effect tier and prints the indicator.
            parameters:
                - text
        trauma:
            name: trauma
            description: Applies a trauma effect tier and prints the indicator.
            parameters:
                - text
        energy:
            name: energy
            description: Applies an energy effect tier and prints the indicator.
            parameters:
                - text
        hygiene:
            name: hygiene
            description: Applies a hygiene effect tier and prints the indicator.
            parameters:
                - text
        hunger:
            name: hunger
            description: Applies a hunger effect tier and prints the indicator.
            parameters:
                - text
        hudStat:
            name: hudStat
            description: Prints a coloured Current Condition line for a stat.
            parameters:
                - text
        gap:
            name: gap
            description: Inserts vertical space between passage link groups (sm/md/lg or 1/2/3).
            parameters:
                - "|+ text"
                - "|+ number"
        kitchenIcon:
            name: kitchenIcon
            description: Prints an icon from img/kitchen-icons/{folder}/{name}.png.
            parameters:
                - text &+ text
                - text &+ text |+ text
        kitchenCookActions:
            name: kitchenCookActions
            description: Kitchen Cook a Meal and Read a Cookbook actions.
            widget: true
            parameters: []
        hudTip:
            name: hudTip
            description: Prints a tip block when sidebar hints are enabled.
            parameters: []
